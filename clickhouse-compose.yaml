version: "3.9"

services:
  clickhouse:
    image: clickhouse/clickhouse-server:24.8
    container_name: clickhouse-ml
    restart: unless-stopped
    ports:
      - "8123:8123"   # HTTP (clickhouse-connect, UI)
      - "9000:9000"   # TCP (clickhouse-client)
    environment:
      CLICKHOUSE_DB: ml_histopath
      CLICKHOUSE_USER: default
      CLICKHOUSE_PASSWORD: ""
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
    volumes:
      - ./db/clickhouse/data:/var/lib/clickhouse
      - ./db/clickhouse/init:/docker-entrypoint-initdb.d
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
